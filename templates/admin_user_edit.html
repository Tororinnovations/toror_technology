{% extends 'base.html' %}
{% set title = 'Edit user · ' ~ site_name %}
{% block content %}
  <section class="section admin-section">
    <div class="section-head">
      <h3>Edit user</h3>
      <a class="btn" href="/admin/users">Back</a>
    </div>
    <form class="card form-card" method="post">
      <div class="form-grid">
        <div class="field"><label>Name</label><input name="name" value="{{ user.name }}" required></div>
        <div class="field"><label>Username</label><input name="username" value="{{ user.username }}" required></div>
        <div class="field"><label>Email</label><input type="email" name="email" value="{{ user.email }}" required></div>
        <div class="field"><label>New password</label><input type="password" name="password" placeholder="Leave blank to keep current"></div>
      </div>
      <div class="muted">Location: {{ user.location_text or '—' }}</div>
      <div class="muted">Device: {{ user.device_info or '—' }}</div>
      <button class="btn primary" type="submit">Save changes</button>
    </form>
  </section>
{% endblock %}
