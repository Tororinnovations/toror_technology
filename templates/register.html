{% extends 'base.html' %}
{% set title = 'Register · ' ~ site_name %}
{% block content %}
  <section class="auth-card hero auth-hero">
    <div class="auth-copy">
      <span class="badge">Create account</span>
      <h2>{{ site_name }}</h2>
      <p>Register with your name, username, email, and password.</p>
      <form class="grid auth-form" method="post" data-auth-form>
        <input type="hidden" name="location_text" data-location-text>
        <input type="hidden" name="location_lat" data-location-lat>
        <input type="hidden" name="location_lng" data-location-lng>
        <input type="hidden" name="device_info" data-device-info>
        <div class="form-grid">
          <div class="field"><label>Name</label><input name="name" autocomplete="name" required></div>
          <div class="field"><label>Username</label><input name="username" autocomplete="username" required></div>
          <div class="field"><label>Email</label><input type="email" name="email" autocomplete="email" required></div>
          <div class="field"><label>Password</label><input type="password" name="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn primary" type="submit">Register</button>
      </form>
      <div class="auth-switch">
        <span>Have an account?</span>
        <a class="btn ghost" href="/login">Login</a>
      </div>
    </div>
    <div class="logo-center auth-logo">
      <img src="{{ logo_path }}" alt="Company logo">
    </div>
  </section>
{% endblock %}
