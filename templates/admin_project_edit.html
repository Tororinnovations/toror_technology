{% extends 'base.html' %}
{% set title = 'Edit Project · ' ~ site_name %}
{% block content %}
  <section class="section">
    <div class="card form-card">
      <h3>Edit project</h3>
      <form class="grid" method="post" enctype="multipart/form-data">
        <div class="form-grid">
          <div class="field"><label>Title</label><input name="title" value="{{ project.title }}" required></div>
          <div class="field"><label>Status</label><select name="status"><option {% if project.status=='Active' %}selected{% endif %}>Active</option><option {% if project.status=='Draft' %}selected{% endif %}>Draft</option><option {% if project.status=='Completed' %}selected{% endif %}>Completed</option></select></div>
        </div>
        <div class="field"><label>Summary</label><textarea name="summary" required>{{ project.summary }}</textarea></div>
        <div class="field"><label>Link</label><input name="link" value="{{ project.link }}"></div>
        <div class="field"><label>Add attachments</label><input type="file" name="attachments" multiple accept=".pdf,.xlsx,.xls,.docx,.pptx,.txt,.png,.jpg,.jpeg,.webp,.mp4,.webm,.mov,.m4v"></div>
        <button class="btn primary" type="submit">Update project</button>
      </form>
    </div>
  </section>
{% endblock %}
