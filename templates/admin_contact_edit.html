{% extends 'base.html' %}
{% set title = 'Edit Contact · ' ~ site_name %}
{% block content %}
  <section class="section">
    <div class="card form-card">
      <h3>Edit contact</h3>
      <form class="grid" method="post">
        <div class="form-grid">
          <div class="field"><label>Name</label><input name="name" value="{{ contact.name }}" required></div>
          <div class="field"><label>Email</label><input type="email" name="email" value="{{ contact.email }}"></div>
          <div class="field"><label>Phone</label><input name="phone" value="{{ contact.phone }}"></div>
          <div class="field"><label>Notes</label><input name="notes" value="{{ contact.notes }}"></div>
        </div>
        <button class="btn primary" type="submit">Update contact</button>
      </form>
    </div>
  </section>
{% endblock %}
