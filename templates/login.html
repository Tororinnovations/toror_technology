{% extends 'base.html' %}
{% set title = 'Login · ' ~ site_name %}
{% block content %}
  <section class="auth-card hero auth-hero">
    <div class="auth-copy">
      <span class="badge">Welcome back</span>
      <h2>{{ site_name }}</h2>
      <p>Log in with your username or email and password.</p>
      <form class="grid auth-form" method="post" data-auth-form>
        <input type="hidden" name="location_text" data-location-text>
        <input type="hidden" name="location_lat" data-location-lat>
        <input type="hidden" name="location_lng" data-location-lng>
        <input type="hidden" name="device_info" data-device-info>
        <div class="form-grid">
          <div class="field"><label>Username or email</label><input name="identifier" autocomplete="username" required></div>
          <div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div>
        </div>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <div class="auth-switch">
        <span>Need an account?</span>
        <a class="btn ghost" href="/register">Register</a>
      </div>
    </div>
    <div class="logo-center auth-logo">
      <img src="{{ logo_path }}" alt="Company logo">
    </div>
  </section>
{% endblock %}
