{% extends 'base.html' %}
{% set title = site_name %}
{% block content %}
  <section class="hero">
    <div>
      <span class="badge">Company site</span>
      <h2>{{ site_name }}</h2>
      <p>{{ hero_text or tagline }}</p>
      <div class="hero-ctas">
        <a class="btn primary" href="/register">Register</a>
        <a class="btn" href="/login">Login</a>
      </div>
    </div>
    <div class="logo-center">
      <img src="{{ logo_path }}" alt="Company logo">
    </div>
  </section>
{% endblock %}
